<script>

var tbox, clearBtn;

function clearLog(){
  xClearLogCat();
  tBox.setText("");
}

function setSize(){
   var bh = clearBtn.node.offsetHeight + 5;
   tBox.node.style.width = (window.innerWidth - 10) + "px";
   tBox.node.style.height = (window.innerHeight - bh) + "px";
}

function main(){
   var layout = new xbLayout(2,1,[],"error_log_layout");
   clearBtn = new xbButton("Clear Log","btn-primary btn-lg btn-block")
                     .bindFunction(clearLog);
   var panel = new xbPanel();
   tBox = new xbTextBox("","log")
   panel.addElement(tBox);
   layout.addElement(clearBtn,0,0)
         .addElement(panel,1,0)
         .setToTop();
   setSize();
   window.onresize = setSize;
   var logcat = xGetLogCatFormated("logcat","D");
   tBox.setText(logcat);
}

main();

</script>
</body>
</html>
