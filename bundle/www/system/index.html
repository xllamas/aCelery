<!DOCTYPE html>
<html lang="en" data-acelery-theme="acelery" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aCelery</title>
<link rel="stylesheet" type="text/css" href="/tools/css/bootstrap.min.css" />
<link rel="stylesheet" type="text/css" href="/tools/css/themes/_dark.css" />
<link rel="stylesheet" type="text/css" id="xbtheme" href="/tools/css/themes/acelery.css" />
<link rel="stylesheet" type="text/css" href="/tools/fontawesome/css/all.min.css" />
<link rel="stylesheet" type="text/css" href="/system/style/acelery.css" />

<!-- The same import map user apps get (§3.2). The system shell is built the
     way an app is and has no privileged access to anything. -->
<script type="importmap">
{ "imports": { "acelery/": "/tools/js/acelery/" } }
</script>
</head>
<body>
<!--
  Copyright 2014: Xavier Llamas Rolland
  This software distributed under the GPLv3 License

  This page carried 1,024 lines of IDE and seven classic <script> tags. Both
  are gone: the shell is acelery/ide.js, a component tree on acelery/ui.js, and
  nothing here loads xscript.js, bootstrap.bundle.min.js or Tempus Dominus.
  react-bootstrap implements the interactive components in the component tree
  itself, so Bootstrap's own JavaScript has nothing left to do (§3.1a).
-->
<script type="module">
import { createEditor } from "acelery/editor.js";
import start from "acelery/ide.js";

/* The editor is a named global because it is not a component and should not
   pretend to be one; the IDE screen creates and destroys it against a DOM node
   it owns. `forceSaveFile` is likewise global, because the Flutter shell calls
   it by name when the app is paused or backed out of
   (lib/src/shell/host_bridge.dart). */
window.aceleryEditor = { createEditor };

start();
</script>
</body>
</html>
