/*     Project        */

function listProjects(mode){
   var pList = new xbListGroup();
   var projF = new xFile();
   var path = projF.getExtStoragePath() + "/aCelery/www/";
   var fname, injson;
   var descr = "";
   
   function cCallback(mode,f){
      if (mode == "open")
         return function(){openProject(f)};
      else
      if (mode == "delete")
         return function(){deleteProject(f)};
      else
      if (mode == "export")
         return function(){exportProject(f)};
   }
   
   var files = projF.listFiles("user",path);
   if (files){
      for (var i = 0; i < files.length; i++){
         if (files[i].directory){
            fname = files[i].fname;
            projF.open("acelery_app.json",path + "user/" + fname);
            inJson = projF.read();
            if (inJson)
               descr = JSON.parse(inJson).description;
            else
               descr = "";
            projF.close();
            pList.addItem(new xbListGroupItem()   
                              .bindFunction(cCallback(mode,fname))
                              .addElement(new xMultiHtml("h3")
                                              .addElement(new xSpan("","fa-solid fa-file"))
                                              .addElement(new xText(" " + fname)))
                              .addElement(new xbPara(descr)));
         }
      }
   }
   var s = new xSection()
               .addElement(new xbAlert("alert-success acelery_selalert")
                               .addElement(new xText("Select project to " + mode )))
               .addElement(pList);
   
   ideLayout.replaceElement(s,1,0);
}

function newProject(){
   var iName, iDescription, okButton;
   
   newAppModal = new xbModal("New Project","fade");
   iName = new xbStringInput("Name: ","appname")
               .setPlaceholder("Your app name. Max 16 letters or numbers");
   iDescription = new xbTextAreaInput("Description: ","appdesc",3)
                      .setPlaceholder("Short description of your app, 140 chars max.");
   okButton = new xbButton("Create App","btn-primary")
                  .bindFunction(function(){createProject(iName,iDescription)});

   newAppModal.addToBody(iName)
              .addToBody(iDescription)
              .addCloseButton("Close")
              .addToFooter(okButton)
              .show();
}

function createProject(iName,iDesc){
   var pName = iName.getValue().trim();

   function isValidName(str) { return ; }
   

   if (!(/^\w+$/.test(pName))){
      xAlertDialog("Create Project","Name should be 16 leters or numbers max.");
      return;
   }                      
   if (iDesc.getValue().length > 140){
      xAlertDialog("Create Project","Description should be maximum 140 chars long.");
      return;
   }
   pName = pName.charAt(0).toUpperCase() + pName.slice(1);
   
   newAppModal.hide();
   var appFile = new xFile();
   var path = appFile.getExtStoragePath() + "/aCelery/www/user/";
   appFile.mkDir(pName,path);
   var appObj = {name: pName, description: iDesc.getValue()};
   var appJson = JSON.stringify(appObj);
   appFile.open("acelery_app.json",path + "/" + pName);
   appFile.write(appJson,false);
   appFile.close();
   openProject(pName);
}

function openProject(project){
   currentProject = project;
   navBar.setTitle("aCelery Project: " + project,"h4");
   var e = ideLayout.getElement(1,0);
   if (e)
      e.remove();
   tweakIdeMenu();
}
 
function closeProject(){
   checkOpenFile();
   currentProject = "";
   currentFile = "";
   hasFileChanged = false;
   navBar.setTitle("aCelery IDE","h4");
   var e = ideLayout.getElement(1,0);
   if (e)
      e.remove();
   tweakIdeMenu();
}

function deleteProject(p){
   if (confirm("Delete project " + p + " and all its files?")){
      var file = new xFile();
      var path = file.getExtStoragePath() + "/aCelery/www/user/";
      file.open(p,path);
      file.deleteFile();
      listProjects("delete");
   }
}

function importProject(){
   var imp = new xImportProject();
   imp.get();
}

function exportProject(p){
   var exP = new xExportProject(p);
   exP.get();
}

function runProject(){
   if (currentProject != ""){
      xRunUserApp(currentProject,currentProject,true);
   }
}

/*         File                */

function setEditorSize(){
   if (editor && editorCont && editorCont.node){
      var nh = navBar.node.offsetHeight;
      editorCont.node.style.width = window.innerWidth + "px";
      editorCont.node.style.height = (window.innerHeight - nh) + "px";
      editor.setSize(window.innerWidth,window.innerHeight -nh);
   }
}

function checkOpenFile(){
  
   window.onresize = null;
   if ((currentFile != "") && hasFileChanged){
     if (confirm("Save changes to file: " + currentFile + "?"))
        saveFile();
   }
}

function fileChangeListener(e){
   hasFileChanged = true;
   navBar.getNavItem(1).getElement(2).disabled(false);    // enable file save
}

function listFiles(mode){
   var item
   var pList = new xbListGroup();
   var projF = new xFile();
   var path = projF.getExtStoragePath() + "/aCelery/www/user/";
   var fname;
   
   function cCallback(mode,f){
      if (mode == "open")
         return function(){openFile(f)};
      else
         return function(){deleteFile(f)};
   }
   
   var files = projF.listFiles(currentProject,path);
   if (files){
      for (var i = 0; i < files.length; i++){
         if (!files[i].directory){
            fname = files[i].fname;
            pList.addItem(new xbListGroupItem()   
                              .bindFunction(cCallback(mode,fname))
                              .addElement(new xMultiHtml("h3")
                                              .addElement(new xSpan("","fa-solid fa-file"))
                                              .addElement(new xText(" " + fname))));
         }
      }
   }
   var s = new xSection()
               .addElement(new xbAlert("alert-success acelery_selalert")
                               .addElement(new xText("Select file to " + mode)))
               .addElement(pList);
   
   ideLayout.replaceElement(s,1,0);
}

function newFile(){
   var iName, iType, okButton;
   
   newFileModal = new xbModal("New File for Project: " + currentProject,"fade");
   iName = new xbStringInput("Name: ","filename")
               .setPlaceholder("Your file name without extension");
   iType = new xbSelect("Type","type")
               .addOption("Javascript",".js")
               .addOption("CSS",".css");
   okButton = new xbButton("Create File","btn-primary")
                  .bindFunction(function(){createFile(iName,iType)});

   newFileModal.addToBody(iName)
               .addToBody(iType)      
               .addCloseButton("Close")
               .addToFooter(okButton)
               .show();
}

function createFile(iName,iType){
   newFileModal.hide();
   var fName = iName.getValue().trim();
   var File = new xFile();
   var path = File.getExtStoragePath() + "/aCelery/www/user/" + currentProject;
   File.open(fName + iType.getValue(),path);
   File.write("");
   File.close();
   openFile(fName + iType.getValue());
}

function openFile(f){
   var file = new xFile();
   var path = file.getExtStoragePath() + "/aCelery/www/user/" + currentProject + "/";
   var content, ext, m;
   
   currentFile = f;
   ext = f.substr((~-f.lastIndexOf(".") >>> 0) + 2);
   if (ext == "js")
      m = "text/javascript";
   else
   if (ext == "css")
      m = "text/css";
   else
   if (ext == "php")
      m = "application/x-httpd-php";
   else
      m = "text/html";
   tweakIdeMenu();
   file.open(f,path);
   content = file.read();
   file.close();
   editorCont = new xTextBox("","codemirror");
   ideLayout.replaceElement(editorCont,1,0);
   editor = new CodeMirror(editorCont.node, {
        lineNumbers: true,
        mode: m,
        value: content
      });
   if (editor_theme != "")
      editor.setOption("theme",editor_theme);
   editor.on("change",fileChangeListener);
   setEditorSize();
   window.onresize = setEditorSize;
}

function deleteFile(f){
   if (confirm("Delete File: " + f + " ?")){
      var file = new xFile();
      var path = file.getExtStoragePath() + "/aCelery/www/user/" + currentProject + "/";
      file.open(f,path);
      file.deleteFile();
      listFiles("delete");
   }
}

function closeFile(){
   checkOpenFile();
   currentFile = "";
   hasFileChanged = false;
   var e = ideLayout.getElement(1,0);
   if (e)
      e.remove();
   tweakIdeMenu();
}

function saveFile(){
   var file = new xFile();
   var path = file.getExtStoragePath() + "/aCelery/www/user/" + currentProject + "/";
   var content;
   
   file.open(currentFile,path);
   content = editor.getValue();
   file.write(content);
   file.close();
   hasFileChanged = false;
   navBar.getNavItem(1).getElement(2).disabled(true);    // disable file save
}

function forceSaveFile(){
   if ((currentFile != "") && hasFileChanged)
      saveFile();
   if (currentDb)
      currentDb.closeDB();
}

function exitIde(){
   checkOpenFile();
   currentProject = "";
   currentFile = "";
   hasFileChanged = false;
   mainMenu();
}

     navBar.getNavItem(0).getElement(1).disabled(false);  // enable project open
     navBar.getNavItem(0).getElement(2).disabled(true);   // disable project close
     if (typeof Android == "undefined")
        navBar.getNavItem(0).getElement(4).disabled(true);   // disable project import
     navBar.getNavItem(0).getElement(5).disabled(false);   // enable project export
  }
  else{
     navBar.getNavItem(1).disabled(false);                 // enable File dropdown
     navBar.getNavItem(2).disabled(false);                 // enable run
     navBar.getNavItem(0).getElement(0).disabled(true);    // disable project new
     navBar.getNavItem(0).getElement(1).disabled(true);    // disable project open
     navBar.getNavItem(0).getElement(2).disabled(false);   // enable project close
     navBar.getNavItem(0).getElement(3).disabled(true);   // disable project delete
     if (typeof Android == "undefined")
        navBar.getNavItem(0).getElement(4).disabled(true);   // disable project import
     navBar.getNavItem(0).getElement(5).disabled(false);   // enable project export
  }
  
  if (currentFile == ""){
     navBar.getNavItem(1).getElement(0).disabled(false);    // enable file new
     navBar.getNavItem(1).getElement(1).disabled(false);    // enable file open
     navBar.getNavItem(1).getElement(2).disabled(true);    // disable file save
     navBar.getNavItem(1).getElement(3).disabled(true);    // disable file close
     navBar.getNavItem(1).getElement(4).disabled(false);    // enable file close
  }
  else{
     navBar.getNavItem(1).getElement(0).disabled(true);    // disable file new
     navBar.getNavItem(1).getElement(1).disabled(true);    // disable file open
     navBar.getNavItem(1).getElement(2).disabled(true);    // disable file save
     navBar.getNavItem(1).getElement(3).disabled(false);    // enable file close
     navBar.getNavItem(1).getElement(4).disabled(true);    // disable file close
  }
}

/*               DB Manager              */

function listDbs(mode){
   var dbList = new xbListGroup();
   var dbF = new xFile();
   var path = dbF.getExtStoragePath() + "/aCelery/";
   var fname;
   
   function cCallback(mode,f){
      if (mode == "open")
         return function(){openDb(f)};
      else
         return function(){deleteDb(f)}
   }
   
   var files = dbF.listFiles("db",path);
   if (files){
      for (var i = 0; i < files.length; i++){
         fname = files[i].fname;
         var ext = fname.substr(fname.lastIndexOf('.') + 1);
         if (ext.indexOf("journal") == -1){
            dbList.addItem(new xbListGroupItem()   
                               .bindFunction(cCallback(mode,fname))
                               .addElement(new xMultiHtml("h3")
                                               .addElement(new xSpan("","fa-solid fa-hard-drive"))
                                               .addElement(new xText(" " + fname))));
         }
      }
   }
   var s = new xSection()
               .addElement(new xbAlert("alert-success acelery_selalert")
                               .addElement(new xText("Select database to " + mode )))
               .addElement(dbList);
   
   dbLayout.replaceElement(s,1,0);
}

function newDb(){
   var iName, okButton;
   
   newDbModal = new xbModal("New Database","fade");
   iName = new xbStringInput("Name: ","dbname")
               .setPlaceholder("Database name without extension");
   okButton = new xbButton("Create Database","btn-primary")
                  .bindFunction(function(){createDb(iName)});

   newDbModal.addToBody(iName)

function createDb(iName){
   newDbModal.hide();
   var dbname = iName.getValue().trim() + ".db";

}

function openDb(db){
   currentDb = new xSQL();
   currentDb.openDB(db);
   currentDbName = db;
   navBar.setTitle("DB Manager: " + db,"h4");
   var e = dbLayout.getElement(1,0);
   if (e)
      e.remove();
   tweakDbManMenu();
}

function deleteDb(db){
   if (confirm("Delete Database: " + db)){
      if (currentDb){
         currentDb.deleteDB(db);
      }
      else{
         var tmpDb = new xSQL();
         tmpDb.deleteDB(db);
      }
      listDbs("delete")
   }
}

function closeDb(){
   closeTable();
   if (currentDb){
      currentDb.closeDB();
      currentDb = null;
      currentDbName = ""
      navBar.setTitle("DB Manager","h4");
      var e = dbLayout.getElement(1,0);
      if (e)
         e.remove();
      tweakDbManMenu();
   }
}

function listTables(mode){
   if (!currentDb)
      return;

   function cCallback(mode,f){
      if (mode == "open")
         return function(){selFldsList(f)};
      else
      if (mode == "delete")
         return function(){deleteTable(f)};
      else
      if (mode == "info")
         return function(){getTableInfo(f)};   
   }
   
   if (currentDb.sqlSelect("select name from sqlite_master where type = 'table'") == -1)
      return;
   var tableList = new xbListGroup();
   var table;
   while(table = currentDb.getNextRow()){
      tableList.addItem(new xbListGroupItem()   
                           .bindFunction(cCallback(mode,table["name"]))
                           .addElement(new xMultiHtml("h3")
                                           .addElement(new xSpan("","fa-solid fa-list"))
                                           .addElement(new xText(" " + table["name"]))));
   }
   currentDb.closeCursor();
   var s = new xSection()
               .addElement(new xbAlert("alert-success acelery_selalert")
                               .addElement(new xText("Select table to " + mode )))
               .addElement(tableList);
   
   dbLayout.replaceElement(s,1,0);
}

function getTableInfo(table){
   if (!currentDb)
      return;
   tableInfo = new xbTable("table-striped");
   tableInfo.addHeadings(["Name","Type","Not Null","Default","PK"]);
   if (currentDb.sqlSelect("PRAGMA table_info(" + table + ")") == -1)
      return;
   while (fld = currentDb.getNextRow()){
      tableInfo.addRow([fld["name"],fld.type,fld.notnull,fld.dflt_value,fld.pk]);
   }
   currentDb.closeCursor();
   var s = new xbTitlePanel("Table: " + table);
   s.addElement(tableInfo);
   dbLayout.replaceElement(s,1,0);
}

function selFldsList(table){
   if (!currentDb)
      return;
   currentTable = table;
   if (currentDb.sqlSelect("PRAGMA table_info(" + table + ")") == -1)
      return;
   var selTable = new xbElementsTable();
   selTable.addHeadings([new xText("Column")]);
   while (fld = currentDb.getNextRow()){
      selTable.addRow([new xbCheckBox(fld["name"],fld["name"] + "_x")]);
   }
   var panel = new xbTitlePanel("Columns to List")
                   .addElement(selTable)
                   .addElement(new xbButton("Open Table","btn-primary")
                                   .bindFunction(function(){openTable(table)}));
   dbLayout.replaceElement(panel,1,0);
}

function openTable(table){
   var inlist, tableMaint, fname, check, type;
   
   if (!currentDb)
      return;
      
   currentTable = table;
   if (currentDb.sqlSelect("PRAGMA table_info(" + table + ")") == -1)
      return;
   tabMaint = new xbTableMaint(currentDb,table,table);
   while (fld = currentDb.getNextRow()){
      fname = fld["name"];
      check = document.getElementsByName(fname + "_x")[0];
      if (check.checked)
         inlist = true;
      else
         inlist = false;
      type = fld.type.toUpperCase();
      if ((type.indexOf("INT") >= 0) ||
          (type.indexOf("DOU") >= 0) ||
          (type.indexOf("REA") >= 0) ||
          (type.indexOf("FLO") >= 0) ||
          (type.indexOf("NUM") >= 0) ||
          (type.indexOf("DEC") >= 0) ||
          (type.indexOf("BOO") >= 0) ||
          (type.indexOf("DAT") >= 0)){
          tabMaint.addField(new xbField("number",fname,fname,inlist,true));
      }
      else{
          tabMaint.addField(new xbField("string",fname,fname,inlist,true));
      }
   }
   currentDb.closeCursor();
   dbLayout.replaceElement(tabMaint,1,0);
   tweakDbManMenu();
   tabMaint.run();
}

function closeTable(){
   if (currentTable != ""){
      currentTable = "";
      tweakDbManMenu();
      var e = dbLayout.getElement(1,0);
      if (e)
         e.remove();
   }
}

function deleteTable(table){
   if (confirm("Delete table: " + table)){
      var q = "drop table " + table;
      if (currentDb)
         currentDb.sqlExec(q);
      listTables("delete");
   }
}

            if (first){
               for(fld in row)
                  head.push(fld);
               table.addHeadings(head);
            }
            first = false;
            trow = [];
            for (fld in row)
               trow.push(row[fld])
            table.addRow(trow);
         }
         currentDb.closeCursor();
         if (first)
            result.addElement(new xText("Zero rows returned"));
         else
            result.addElement(table);
      }
      else
      if (q.toLowerCase().indexOf("insert") == 0){
         rowid = currentDb.sqlInsert(q);
         if (rowid == -1)
            result.addElement(new xText("Error: No row inserted"))
         else
            result.addElement(new xText("Inserted Row Id: " + rowid));
      }
      else{
         currentDb.sqlExec(q);
      }
   }
   
   function close(){
      var e = dbLayout.getElement(1,0);
      if (e)
         e.remove();
   }
   
   var result = new xbPanel();
   var query = new xbTextAreaInput("Query","query",5); 
   var panel = new xbTitlePanel("SQL Query")
                   .addElement(query)
                   .addElement(new xbButtonGroup()
                                   .addElement(new xbButton("Exec","btn-primary").bindFunction(execSQL))
                                   .addElement(new xbButton("Clear").bindFunction(function(){query.setValue("")}))
                                   .addElement(new xbButton("Close").bindFunction(close)))
                   .addElement(new xVerticalSpacer(20))
                   .addElement(result);
   
   dbLayout.replaceElement(panel,1,0);

}

function exitDbMan(){
   if (currentDb)
      currentDb.closeDB();
   currentDbName = "";
   currentTable = "";
   mainMenu();
}

function tweakDbManMenu(){
  if (currentDbName == ""){
     navBar.getNavItem(1).disabled(true);                 // disable table dropdown
     navBar.getNavItem(2).disabled(true);                 // disable SQL
     navBar.getNavItem(0).getElement(0).disabled(false);  // enable db new
     navBar.getNavItem(0).getElement(1).disabled(false);  // enable db open
     navBar.getNavItem(0).getElement(2).disabled(true);   // disable db close
     navBar.getNavItem(0).getElement(3).disabled(false);  // enable db delete
  }
  else{
     navBar.getNavItem(1).disabled(false);                 // enable table dropdown
     navBar.getNavItem(2).disabled(false);                 // enable SQL
     navBar.getNavItem(0).getElement(0).disabled(true);    // disable db new
     navBar.getNavItem(0).getElement(1).disabled(true);    // disable db open
     navBar.getNavItem(0).getElement(2).disabled(false);   // enable db close
     navBar.getNavItem(0).getElement(3).disabled(true);    // disable db delete
  }
  
  if (currentTable == ""){
     navBar.getNavItem(1).getElement(0).disabled(false);    // enable table info
     navBar.getNavItem(1).getElement(1).disabled(false);    // enable table open
     navBar.getNavItem(1).getElement(2).disabled(true);     // disable table close
     navBar.getNavItem(1).getElement(3).disabled(false);    // enable table delete
  }
  else{
     navBar.getNavItem(1).getElement(0).disabled(true);    // disable table info
     navBar.getNavItem(1).getElement(1).disabled(true);    // disable table open
     navBar.getNavItem(1).getElement(2).disabled(false);   // enable table close
     navBar.getNavItem(1).getElement(3).disabled(true);    // disable table delete
  }
}

/*  aCeleryInit     */

function aCeleryInit(){
   var row, th;
   
   configDb = new xSQL();
   configDb.openDB("acelery.db");
   configDb.sqlExec("create table if not exists config (cfg_key string unique, cfg_value string)");
   configDb.sqlSelect("select cfg_key,cfg_value from config");
   while (row = configDb.getNextRow()){
      if (row.cfg_key == "theme"){
         th = new xbTheme();
         th.setTheme(row.cfg_value);
         acelery_theme = row.cfg_value;
      }
      else
      if (row.cfg_key == "editortheme"){
         editor_theme = row.cfg_value;
         LazyLoad.css(["/tools/codemirror/theme/" + editor_theme + ".css"]);
      }   
   }
}
